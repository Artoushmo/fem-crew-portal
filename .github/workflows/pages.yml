name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A project site lives at /<repo>/, so the build needs that prefix.
      #
      # The Supabase values come from repository *variables*, not secrets: both
      # end up in the JavaScript bundle by design. The project URL identifies
      # the project and the publishable key grants nothing — row level security
      # is what protects the data. Leave them unset and the site falls back to
      # the unauthenticated demo, which is what it did until now.
      - name: Build static site
        env:
          NEXT_STATIC_EXPORT: '1'
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_OTP_LENGTH: ${{ vars.NEXT_PUBLIC_OTP_LENGTH }}
        run: npm run build

      # Stops Pages running the output through Jekyll, which drops _next/.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
